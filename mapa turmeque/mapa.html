<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mapa de Turmequé</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="estilos.css" />
</head>
<body class="pagina-mapa">
  <header class="barra">
    <a class="volver" href="index.html">← Inicio</a>
    <h1>📍 Lugares turísticos de Turmequé</h1>
    <button id="btn-ubicacion">Mi ubicación</button>
  </header>

  <div id="map"></div>

  <!-- Panel de rutas -->
  <div class="panel" id="panel">
    <div class="panel-titulo">
      <h2>🧭 ¿A dónde quieres ir?</h2>
      <button id="btn-panel" class="mini" title="Minimizar">−</button>
    </div>

    <div id="panel-cuerpo">
      <label>Desde
        <select id="sel-origen"></select>
      </label>
      <label>Hasta
        <select id="sel-destino"></select>
      </label>

      <div class="modos">
        <label><input type="radio" name="modo" value="foot" checked /> 🚶 A pie</label>
        <label><input type="radio" name="modo" value="car" /> 🚗 En carro</label>
      </div>

      <div class="acciones">
        <button id="btn-ruta">Trazar ruta</button>
        <button id="btn-limpiar" class="secundario">Quitar</button>
      </div>

      <p id="info-ruta"></p>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="mapa.js"></script>
</body>
</html>
